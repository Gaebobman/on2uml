[project]
name = "on2uml"
version = "0.1.0"
description = "Render OWL ontologies (Turtle) as UML-style class diagram images via PlantUML"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "rdflib>=7.0",
    "pyyaml>=6.0",
]

[project.scripts]
on2uml = "on2uml.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"
